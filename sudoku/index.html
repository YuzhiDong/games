<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小动物数独 — Daisy 的动物拼布床</title>
  <style>
:root {
  --bg-oat: #F6EFE3;
  --ink: #2B3A55;
  --moss: #6A9C5B;
  --moss-dark: #4E7A40;
  --berry: #9B6BB3;
  --pumpkin: #F29544;
  --lake: #5FB3C9;
  --cream: #FFE7A3;
  --cherry: #F6B5C0;
  --wood-paper: #EADCC8;
  --wood-grain: #DECBB1;
  --accent: #F29544;
  --size: 4;

  --box-0: #FCE3E7;
  --box-1: #DDF0F4;
  --box-2: #E8F1DC;
  --box-3: #FFF3CF;
  --box-4: #EFE4F7;
  --box-5: #FDE8D0;

  --font-main: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background-color: var(--bg-oat);
  background-image:
    radial-gradient(rgba(43, 58, 85, 0.045) 1px, transparent 0),
    radial-gradient(rgba(242, 149, 68, 0.05) 1.5px, transparent 0),
    linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(246, 239, 227, 0) 45%);
  background-size: 18px 18px, 32px 32px, 100% 100%;
  background-position: 0 0, 9px 9px, 0 0;
  color: var(--ink);
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
}

[hidden] {
  display: none !important;
}

/* Decorative Scenery */
.scenery-top {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 110px;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.bunting-svg {
  width: 100%;
  max-width: 680px;
  height: 44px;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 3px 0 rgba(43, 58, 85, 0.16));
}

.sky-cutouts {
  position: fixed;
  top: 10px;
  right: 12px;
  width: 84px;
  height: 76px;
  pointer-events: none;
  z-index: 0;
  filter: drop-shadow(3px 3px 0 var(--ink));
}

.scenery-hills {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 86px;
  pointer-events: none;
  z-index: 0;
}

.scenery-hills svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Screen Containers */
.app-shell {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.screen {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Paper Cutout Card / Button Base */
.paper-btn {
  appearance: none;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  background: #FFFDF9;
  color: var(--ink);
  font-family: var(--font-main);
  font-weight: 800;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  position: relative;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.paper-btn:hover {
  background-color: #FFF9EB;
}

.paper-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}

.paper-btn:focus-visible,
.theme-btn:focus-visible,
.level-btn:focus-visible,
.pal-btn:focus-visible,
.cell:focus-visible {
  outline: 3.5px dashed var(--pumpkin);
  outline-offset: 3px;
}

/* ==================== HOME SCREEN ==================== */
#screen-home {
  padding: 28px 16px 36px;
  justify-content: flex-start;
  gap: 20px;
}

.home-header {
  text-align: center;
  margin-top: 6px;
  position: relative;
}

.home-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--cream);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 0.88rem;
  font-weight: 800;
  box-shadow: 2px 3px 0 var(--ink);
  margin-bottom: 6px;
  transform: rotate(-1.5deg);
}

.home-title {
  margin: 0;
  font-size: clamp(2.1rem, 7vw, 3rem);
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #FFFDF8;
  -webkit-text-stroke: 2px var(--ink);
  text-shadow:
    0 2px 0 var(--ink),
    2px 0 0 var(--ink),
    -2px 0 0 var(--ink),
    0 -2px 0 var(--ink),
    3px 4px 0 var(--ink);
  line-height: 1.15;
}

.home-section {
  width: 100%;
  max-width: 560px;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.05rem;
  font-weight: 800;
  margin: 0 0 10px 4px;
  color: var(--ink);
}

.section-label-stitch {
  flex: 1;
  height: 0;
  border-bottom: 2px dashed rgba(43, 58, 85, 0.3);
}

/* Theme Swatch Selector */
.theme-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.theme-btn {
  appearance: none;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  background: #FFFDF8;
  box-shadow: 3px 4px 0 var(--ink);
  padding: 10px 6px 8px;
  min-height: 92px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--font-main);
  color: var(--ink);
  position: relative;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
}

.theme-btn::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1.5px dashed rgba(43, 58, 85, 0.22);
  border-radius: 13px;
  pointer-events: none;
}

.theme-btn:active {
  transform: translate(2px, 3px);
  box-shadow: 1px 1px 0 var(--ink);
}

.theme-btn.is-selected {
  background: var(--cream);
  border-width: 3px;
  transform: translateY(-2px);
  box-shadow: 4px 6px 0 var(--ink);
}

.theme-btn.is-selected::before {
  border-color: var(--ink);
  border-width: 2px;
}

.theme-btn-top {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 900;
  font-size: 1rem;
}

.theme-btn-emoji {
  font-size: 1.45rem;
  line-height: 1;
}

.theme-btn-animals {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: rgba(255, 255, 255, 0.78);
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 1.05rem;
  line-height: 1.1;
}

/* Level Pillow Buttons */
.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.level-btn {
  appearance: none;
  min-height: 108px;
  min-width: 88px;
  border: 3px solid var(--ink);
  border-radius: 22px;
  background: #FFFDF8;
  box-shadow: 4px 5px 0 var(--ink);
  padding: 12px 10px 10px;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-family: var(--font-main);
  color: var(--ink);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

/* Pillow inner stitch & corner ears */
.level-btn::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 2px dashed rgba(43, 58, 85, 0.28);
  border-radius: 16px;
  pointer-events: none;
}

.level-btn[data-level="0"] {
  background-color: #E8F1DC;
}
.level-btn[data-level="1"] {
  background-color: #DDF0F4;
}
.level-btn[data-level="2"] {
  background-color: #FCE3E7;
}
.level-btn[data-level="3"] {
  background-color: #FFF3CF;
}

.level-btn:active:not(.is-locked) {
  transform: translate(2px, 3px);
  box-shadow: 2px 2px 0 var(--ink);
}

.level-btn.is-locked {
  background-color: #E6DFD3;
  color: rgba(43, 58, 85, 0.65);
  cursor: not-allowed;
}

.level-head {
  display: flex;
  align-items: center;
  gap: 6px;
}

.level-emoji {
  font-size: 2rem;
  line-height: 1;
  filter: drop-shadow(0 2px 0 rgba(43, 58, 85, 0.18));
}

.level-name-text {
  font-size: 1.28rem;
  font-weight: 900;
}

.level-size-tag {
  font-size: 0.78rem;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.75);
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  padding: 1px 8px;
}

.level-lock-badge {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 1.15rem;
  line-height: 1;
}

.level-stars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 2px;
}

.star {
  font-size: 1.25rem;
  line-height: 1;
  display: inline-block;
  color: rgba(43, 58, 85, 0.22);
  filter: grayscale(1) opacity(0.38);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
}

.star.is-on {
  color: #FFB800;
  filter: none;
  transform: scale(1.08);
  text-shadow: 0 2px 0 var(--ink);
}

/* ==================== GAME SCREEN ==================== */
#screen-game {
  padding: 6px 8px 8px;
  justify-content: flex-start;
  gap: 6px;
  min-height: 100vh;
  min-height: 100dvh;
}

.game-topbar {
  width: min(100vw - 16px, 560px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 64px;
  z-index: 2;
}

.top-btn {
  min-width: 64px;
  min-height: 64px;
  width: 64px;
  height: 64px;
  border-radius: 18px;
  font-size: 1.75rem;
  background: #FFFDF8;
  border: 2.5px solid var(--ink);
  box-shadow: 3px 4px 0 var(--ink);
  flex-shrink: 0;
}

#btn-hint {
  background: var(--cream);
}

#btn-sound[aria-pressed="false"] {
  background: #E6DFD3;
  opacity: 0.85;
}

.level-pill {
  flex: 1;
  min-height: 54px;
  background: #FFFDF8;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  box-shadow: 3px 4px 0 var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 1.22rem;
  font-weight: 900;
  position: relative;
}

.level-pill::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1.5px dashed rgba(43, 58, 85, 0.25);
  border-radius: 13px;
  pointer-events: none;
}

/* Stage: Bed + Palette */
.game-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  width: 100%;
}

/* Quilt Bed Wrapper */
.quilt-bed {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

/* Cutout Headboard & Pillow above the Quilt */
.bed-headboard {
  width: calc(min(100vw - 16px, 560px) * 0.84);
  height: 28px;
  background:
    repeating-linear-gradient(
      90deg,
      #D99B66 0px,
      #D99B66 22px,
      #C58550 22px,
      #C58550 25px
    );
  border: 3px solid var(--ink);
  border-bottom: none;
  border-radius: 22px 22px 0 0;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 14px;
  box-shadow: 4px 0 0 var(--ink);
  z-index: 1;
}

.bed-pillow {
  width: 36%;
  height: 18px;
  background: #FFFDF8;
  border: 2.5px solid var(--ink);
  border-bottom: none;
  border-radius: 14px 14px 0 0;
  position: relative;
  top: 2px;
  background-image: radial-gradient(var(--cherry) 1.5px, transparent 1.5px);
  background-size: 10px 10px;
}

.bed-pillow::after {
  content: "";
  position: absolute;
  inset: 3px 5px 0 5px;
  border-top: 1.5px dashed rgba(43, 58, 85, 0.35);
  border-radius: 10px 10px 0 0;
}

/* Board = The Patchwork Quilt */
#board {
  --board-w: min(100vw - 16px, 560px);
  width: var(--board-w);
  height: var(--board-w);
  display: grid;
  grid-template-columns: repeat(var(--size), 1fr);
  grid-template-rows: repeat(var(--size), 1fr);
  gap: 0;
  background-color: var(--accent);
  border: 3px solid var(--ink);
  border-radius: 24px;
  box-shadow: 6px 6px 0 var(--ink);
  position: relative;
  overflow: hidden;
  z-index: 2;
}

/* White dashed outer quilt stitch */
#board::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 2px dashed rgba(255, 255, 255, 0.85);
  border-radius: 19px;
  pointer-events: none;
  z-index: 6;
}

/* Individual Quilt Cell */
.cell {
  appearance: none;
  margin: 0;
  padding: 0;
  border: none;
  border-right: 1.5px dashed rgba(43, 58, 85, 0.32);
  border-bottom: 1.5px dashed rgba(43, 58, 85, 0.32);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background-color: var(--box-0);
  transition: background-color 0.15s ease, transform 0.12s ease;
  font-family: var(--font-main);
}

/* Remove outer right/bottom borders so frame border is clean */
.cell.is-last-col {
  border-right: none;
}
.cell.is-last-row {
  border-bottom: none;
}

/* Bold stitch dividers between boxes (regions) */
.cell.is-box-right {
  border-right: 3px dashed var(--ink);
}
.cell.is-box-bottom {
  border-bottom: 3px dashed var(--ink);
}

/* Fabric patterns for each box index */
.cell[data-box="0"] {
  background-color: var(--box-0);
  background-image: radial-gradient(rgba(214, 110, 128, 0.22) 2px, transparent 2px);
  background-size: 14px 14px;
}

.cell[data-box="1"] {
  background-color: var(--box-1);
  background-image:
    linear-gradient(90deg, rgba(95, 179, 201, 0.14) 50%, transparent 50%),
    linear-gradient(rgba(95, 179, 201, 0.14) 50%, transparent 50%);
  background-size: 14px 14px;
}

.cell[data-box="2"] {
  background-color: var(--box-2);
  background-image: radial-gradient(rgba(106, 156, 91, 0.22) 1.8px, transparent 1.8px);
  background-size: 12px 12px;
}

.cell[data-box="3"] {
  background-color: var(--box-3);
  background-image: repeating-linear-gradient(
    45deg,
    rgba(242, 149, 68, 0.1) 0px,
    rgba(242, 149, 68, 0.1) 4px,
    transparent 4px,
    transparent 10px
  );
}

.cell[data-box="4"] {
  background-color: var(--box-4);
  background-image: radial-gradient(rgba(155, 107, 179, 0.2) 2px, transparent 2px);
  background-size: 14px 14px;
}

.cell[data-box="5"] {
  background-color: var(--box-5);
  background-image:
    linear-gradient(90deg, rgba(242, 149, 68, 0.14) 50%, transparent 50%),
    linear-gradient(rgba(242, 149, 68, 0.14) 50%, transparent 50%);
  background-size: 14px 14px;
}

/* Given Cell: Thick craft paper / wood patch + red thumbtack pin */
.cell.is-given::before {
  content: "";
  position: absolute;
  inset: 7px;
  background-color: var(--wood-paper);
  background-image: repeating-linear-gradient(
    -12deg,
    rgba(166, 128, 89, 0.12) 0px,
    rgba(166, 128, 89, 0.12) 3px,
    transparent 3px,
    transparent 9px
  );
  border: 2px solid var(--ink);
  border-radius: 14px;
  box-shadow: 2px 2px 0 rgba(43, 58, 85, 0.35);
  pointer-events: none;
  z-index: 1;
}

/* Thumbtack pin on given cell */
.cell.is-given::after {
  content: "";
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FF8A7A, #D9483B 70%);
  border: 1.5px solid var(--ink);
  box-shadow: 0 1.5px 0 rgba(43, 58, 85, 0.45);
  pointer-events: none;
  z-index: 3;
}

/* Selected Empty Cell */
.cell.is-selected {
  background-color: #FFFDF2 !important;
  box-shadow: inset 0 0 0 4px var(--accent), inset 0 0 0 7px #FFFDF8;
  z-index: 4;
}

.cell.is-selected::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 2.5px dashed var(--ink);
  border-radius: 14px;
  pointer-events: none;
  animation: pulse-select 1.2s ease-in-out infinite;
}

/* Animal Emoji Inside Cell */
.cell .animal {
  position: relative;
  z-index: 2;
  font-size: calc((var(--board-w) / var(--size)) * 0.62);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 2px 0 rgba(43, 58, 85, 0.22));
  pointer-events: none;
}

.cell.is-given .animal {
  font-size: calc((var(--board-w) / var(--size)) * 0.52);
  transform: translateY(3px);
}

/* Placed Animal Bounce */
.cell.is-filled .animal {
  animation: pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Ghost animal during gentle mistake */
.cell.is-mistake-ghost .animal {
  opacity: 0.48;
  transform: scale(0.88);
}

/* Shake on mistake (approx 450ms) */
.cell.is-shake,
.level-btn.is-shake {
  animation: gentle-shake 0.44s ease-in-out;
}

/* Hint glow once */
.cell.is-hinted {
  animation: hint-glow 0.9s ease-out;
}

.cell.is-hinted .animal {
  animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Row/Col/Box Golden Shimmer on completion */
.cell.is-line-flash {
  animation: golden-flash 0.75s ease-out;
}

/* Gentle Speech Bubble Toast */
.speech-toast {
  min-height: 28px;
  padding: 3px 14px;
  border-radius: 999px;
  background: #FFFDF8;
  border: 2px solid var(--ink);
  box-shadow: 2px 3px 0 var(--ink);
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

/* ==================== ANIMAL PALETTE TRAY ==================== */
#palette {
  width: min(100vw - 16px, 560px);
  display: grid;
  grid-template-columns: repeat(var(--size), 1fr);
  gap: 6px;
  padding: 6px;
  background: #EADCC8;
  border: 3px solid var(--ink);
  border-radius: 22px;
  box-shadow: 4px 5px 0 var(--ink);
  transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
  position: relative;
  z-index: 2;
}

#palette.is-idle {
  opacity: 0.5;
  filter: saturate(0.65);
}

.pal-btn {
  appearance: none;
  min-height: 88px;
  min-width: 88px;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  background: #FFFDF8;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 2px;
  font-family: var(--font-main);
  color: var(--ink);
  position: relative;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
}

#palette[data-size="6"] {
  gap: 4px;
  padding: 5px;
}

#palette[data-size="6"] .pal-btn {
  min-width: 52px;
  min-height: 76px;
  border-radius: 14px;
}

.pal-btn::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1.5px dashed rgba(43, 58, 85, 0.2);
  border-radius: 13px;
  pointer-events: none;
}

.pal-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}

#palette.is-idle .pal-btn {
  cursor: default;
}

#palette.is-idle .pal-btn:active {
  transform: none;
  box-shadow: 0 4px 0 var(--ink);
}

.pal-emoji {
  font-size: 2.35rem;
  line-height: 1;
  filter: drop-shadow(0 2px 0 rgba(43, 58, 85, 0.18));
}

#palette[data-size="6"] .pal-emoji {
  font-size: 1.85rem;
}

.pal-name {
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.1;
}

/* ==================== WIN OVERLAY ==================== */
#win-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(43, 58, 85, 0.58);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.confetti-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.confetti-piece {
  position: absolute;
  top: -24px;
  width: 14px;
  height: 18px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  animation: confetti-fall 2.6s ease-in forwards;
}

.win-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 400px;
  background: var(--bg-oat);
  border: 3.5px solid var(--ink);
  border-radius: 28px;
  box-shadow: 6px 8px 0 var(--ink);
  padding: 24px 18px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.win-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 2px dashed rgba(43, 58, 85, 0.3);
  border-radius: 21px;
  pointer-events: none;
}

.win-title {
  margin: 0;
  font-size: 1.9rem;
  font-weight: 900;
  color: var(--ink);
}

#win-stars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 4px 0;
}

#win-stars .star {
  font-size: 3.1rem;
}

#win-stars .star.is-on {
  animation: star-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

#win-stars .star.is-on:nth-child(1) {
  animation-delay: 0.08s;
}
#win-stars .star.is-on:nth-child(2) {
  animation-delay: 0.24s;
}
#win-stars .star.is-on:nth-child(3) {
  animation-delay: 0.4s;
}

.win-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
}

.win-btn {
  min-width: 96px;
  min-height: 88px;
  flex: 1;
  padding: 10px 12px;
  font-size: 1.08rem;
  font-weight: 900;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.win-btn-icon {
  font-size: 1.65rem;
  line-height: 1;
}

#btn-next {
  background: var(--cream);
  flex-basis: 100%;
}

#btn-again {
  background: #DDF0F4;
}

#btn-win-home {
  background: #FCE3E7;
}

/* ==================== COMPACT HEIGHT (375x812 single screen) ==================== */
@media (max-height: 830px) and (max-width: 899px) {
  #screen-game {
    padding: 4px 8px 6px;
    gap: 5px;
  }

  .bed-headboard {
    height: 22px;
  }

  .bed-pillow {
    height: 14px;
  }

    min-height: 24px;
    font-size: 0.86rem;
    padding: 2px 12px;
  }
}

/* ==================== DESKTOP / WIDE LAYOUT (>= 900px) ==================== */

    padding: 18px 24px;
    gap: 14px;
  }

    width: 720px;

  }

    width: 180px;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px;

    width: 210px;
    gap: 8px;
  }

    min-height: 88px;
    min-width: 88px;
  }
}

/* ==================== ANIMATIONS ==================== */
@keyframes pop-in {
  0% {
    transform: scale(0);
  }
  65% {
    transform: scale(1.15);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes gentle-shake {
  0%, 100% {
    transform: translateX(0);
  }
  20% {
    transform: translateX(-6px) rotate(-2deg);
  }
  40% {
    transform: translateX(6px) rotate(2deg);
  }
  60% {
    transform: translateX(-4px) rotate(-1deg);
  }
  80% {
    transform: translateX(4px) rotate(1deg);
  }
}

@keyframes hint-glow {
  0% {
    box-shadow: inset 0 0 0 0 var(--cream), 0 0 0 0 var(--pumpkin);
    background-color: #FFF6C2;
  }
  40% {
    box-shadow: inset 0 0 0 6px var(--pumpkin), 0 0 18px 4px rgba(242, 149, 68, 0.7);
    background-color: #FFFDF0;
  }
  100% {
    box-shadow: inset 0 0 0 0 transparent;
  }
}

@keyframes golden-flash {
  0%, 100% {
    filter: brightness(1);
  }
  45% {
    filter: brightness(1.16) saturate(1.25);
    box-shadow: inset 0 0 0 4px #FFB800;
  }
}

@keyframes pulse-select {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(0.95);
  }
}

@keyframes star-pop {
  0% {
    transform: scale(0) rotate(-20deg);
    opacity: 0;
  }
  70% {
    transform: scale(1.25) rotate(8deg);
    opacity: 1;
  }
  100% {
    transform: scale(1.08) rotate(0deg);
    opacity: 1;
  }
}

@keyframes confetti-fall {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(92vh) rotate(520deg);
    opacity: 0.15;
  }
}

/* ==================== REDUCED MOTION ==================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }

  .confetti-layer {
    display: none !important;
  }

  .cell.is-shake,
  .level-btn.is-shake {
    background-color: #FAD4D8 !important;
  }

  .cell.is-hinted {
    background-color: var(--cream) !important;

}

    renderPalette();
    updatePaletteIdleState();
    setToastText('点一格空床位，抱小动物上床睡觉吧');

    showScreen('screen-game');
  }

  function buildBoardDOM(size) {
    var boardEl = document.getElementById('board');
    if (!boardEl) return;
    var core = getCore();
    var shape = core.boxShape(size);
    var boxRows = shape[0];
    var boxCols = shape[1];
    var boxesPerRow = size / boxCols;

    boardEl.innerHTML = '';

    for (var idx = 0; idx < size * size; idx++) {
      var r = Math.floor(idx / size);
      var c = idx % size;
      var br = Math.floor(r / boxRows);
      var bc = Math.floor(c / boxCols);
      var boxIndex = (size === 4) ? ((br + bc) % 4) : ((br * boxesPerRow + bc) % 6);

      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.setAttribute('data-idx', String(idx));
      cell.setAttribute('data-box', String(boxIndex));
      cell.setAttribute('role', 'gridcell');

      if (c === size - 1) {
        cell.classList.add('is-last-col');
      } else if ((c + 1) % boxCols === 0) {
        cell.classList.add('is-box-right');
      }

      if (r === size - 1) {
        cell.classList.add('is-last-row');
      } else if ((r + 1) % boxRows === 0) {
        cell.classList.add('is-box-bottom');
      }

      // 每格内只有一个 <span class="animal"> 放 emoji
      var animalSpan = document.createElement('span');
      animalSpan.className = 'animal';
      cell.appendChild(animalSpan);

      (function (cellIdx) {
        cell.addEventListener('click', function () {
          onCellClick(cellIdx);
        });
      })(idx);

      boardEl.appendChild(cell);
    }
  }

  function getCellEl(idx) {
    var boardEl = document.getElementById('board');
    if (!boardEl) return null;
    return boardEl.querySelector('.cell[data-idx="' + idx + '"]');
  }

  function renderBoardCells() {
    if (!currentState) return;
    var theme = getCurrentTheme();
    var animals = theme.animals || [];
    var size = currentState.size;

    for (var idx = 0; idx < size * size; idx++) {
      var cell = getCellEl(idx);
      if (!cell) continue;
      var val = currentState.cells[idx];
      var isGiven = currentState.puzzle[idx] !== 0;

      cell.classList.toggle('is-given', isGiven);
      cell.classList.toggle('is-filled', !isGiven && val !== 0);
      cell.classList.toggle('is-selected', idx === selectedIdx);

      var span = cell.querySelector('.animal');
      if (span) {
        if (val >= 1 && val <= animals.length) {
          span.textContent = animals[val - 1].emoji;
        } else {
          span.textContent = '';
        }
      }
    }
  }

  function renderPalette() {
    var paletteEl = document.getElementById('palette');
    if (!paletteEl || !currentState) return;
    var theme = getCurrentTheme();
    var animals = theme.animals || [];
    var size = currentState.size;

    paletteEl.innerHTML = '';

    for (var v = 1; v <= size; v++) {
      (function (val) {
        var animal = animals[val - 1] || { emoji: '🐾', name: '动物' };
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pal-btn';
        btn.setAttribute('data-val', String(val));
        btn.setAttribute('aria-label', animal.name);

        var emo = document.createElement('span');
        emo.className = 'pal-emoji';
        emo.textContent = animal.emoji;

        var nm = document.createElement('span');
        nm.className = 'pal-name';
        nm.textContent = animal.name;

        btn.appendChild(emo);
        btn.appendChild(nm);

        btn.addEventListener('click', function () {
          onPaletteClick(val);
        });

        paletteEl.appendChild(btn);
      })(v);
    }
  }

  function updatePaletteIdleState() {
    var paletteEl = document.getElementById('palette');
    if (!paletteEl) return;
    if (selectedIdx === -1 || !currentState || currentState.done) {
      paletteEl.classList.add('is-idle');
    } else {
      paletteEl.classList.remove('is-idle');
    }
  }

  /* ==================== INTERACTIONS ==================== */
  function onCellClick(idx) {
    if (!currentState || currentState.done) return;
    var val = currentState.cells[idx];
    var isGiven = currentState.puzzle[idx] !== 0;
    var theme = getCurrentTheme();
    var animals = theme.animals || [];

    // 点已给格或已填格只读出该动物的 say，不选中
    if (isGiven || val !== 0) {
      var animal = animals[val - 1];
      if (animal && animal.say) {
        speakText(animal.say);
      }
      return;
    }

    // 点空格 → 选中，托盘亮起
    selectedIdx = idx;
    var cells = document.querySelectorAll('#board .cell');
    for (var i = 0; i < cells.length; i++) {
      var cIdx = Number(cells[i].getAttribute('data-idx'));
      cells[i].classList.toggle('is-selected', cIdx === selectedIdx);
    }
    updatePaletteIdleState();
    setToastText('选一只小动物放进格子里吧');
  }

  function onPaletteClick(val) {
    if (!currentState || currentState.done) return;
    // 没选格子时托盘半透明（.is-idle），点托盘无反应
    if (selectedIdx < 0) return;

    var targetIdx = selectedIdx;
    var prevCells = currentState.cells.slice();
    var core = getCore();
    var res = core.applyMove(currentState, targetIdx, val);
    currentState = res.state;

    var theme = getCurrentTheme();
    var animals = theme.animals || [];
    var animal = animals[val - 1] || { emoji: '🐾', name: '小动物', say: '' };
    var data = getData();
    var cellEl = getCellEl(targetIdx);

    if (res.event === 'mistake') {
      // 格子 .is-shake，那只动物在格子里半透明闪现约 400ms 后消失；轻柔低音；读一句随机 gentle。选中保持。
      playMistakeSound();
      speakText(pickRandom(data.gentle, '再想想哦'));

      if (cellEl) {
        var span = cellEl.querySelector('.animal');
        if (span) span.textContent = animal.emoji;
        cellEl.classList.remove('is-shake');
        void cellEl.offsetWidth;
        cellEl.classList.add('is-shake', 'is-mistake-ghost');

        setTimeout(function () {
          if (cellEl) {
            cellEl.classList.remove('is-mistake-ghost');
            if (currentState && currentState.cells[targetIdx] === 0 && span) {
              span.textContent = '';
            }
          }
        }, 400);

        setTimeout(function () {
          if (cellEl) cellEl.classList.remove('is-shake');
        }, 450);
      }
      return;
    }

    if (res.event === 'place' || res.event === 'win') {
      // 选中自动取消
      selectedIdx = -1;
      updatePaletteIdleState();

      if (cellEl) {
        cellEl.classList.remove('is-selected', 'is-shake', 'is-mistake-ghost');
        cellEl.classList.add('is-filled');
        var animalSpan = cellEl.querySelector('.animal');
        if (animalSpan) {
          animalSpan.textContent = animal.emoji;
        }
      }

      playPlaceSound();
      speakText(animal.name);
      flashCompletedUnits(prevCells, currentState.cells, currentState.size, targetIdx);

      if (res.event === 'win') {
        handleWin();
      }
    }
  }

  function onHintClick() {
    if (!currentState || currentState.done) return;
    var core = getCore();
    var data = getData();
    var prevCells = currentState.cells.slice();
    var res = core.hint(currentState);
    if (res.event === 'ignored' || res.idx < 0) return;

    currentState = res.state;
    var hintIdx = res.idx;
    if (selectedIdx === hintIdx) {
      selectedIdx = -1;
      updatePaletteIdleState();
    }

    var val = currentState.cells[hintIdx];
    var theme = getCurrentTheme();
    var animal = (theme.animals && theme.animals[val - 1]) || { emoji: '🐾', name: '小动物' };
    var cellEl = getCellEl(hintIdx);

    if (cellEl) {
      cellEl.classList.remove('is-selected', 'is-shake', 'is-mistake-ghost', 'is-hinted');
      void cellEl.offsetWidth;
      cellEl.classList.add('is-filled', 'is-hinted');
      var span = cellEl.querySelector('.animal');
      if (span) span.textContent = animal.emoji;
    }

    playHintSound();
    speakText(pickRandom(data.hintSay, '看看这里'));
    flashCompletedUnits(prevCells, currentState.cells, currentState.size, hintIdx);

    if (res.event === 'win') {
      handleWin();
    }
  }

  function flashCompletedUnits(prevCells, nextCells, size, changedIdx) {
    var core = getCore();
    if (!core) return;
    var shape = core.boxShape(size);
    var brSize = shape[0];
    var bcSize = shape[1];

    var row = Math.floor(changedIdx / size);
    var col = changedIdx % size;
    var boxR = Math.floor(row / brSize) * brSize;
    var boxC = Math.floor(col / bcSize) * bcSize;

    var toFlash = [];

    // Check row
    var rowDoneBefore = true;
    var rowDoneAfter = true;
    for (var c = 0; c < size; c++) {
      if (prevCells[row * size + c] === 0) rowDoneBefore = false;
      if (nextCells[row * size + c] === 0) rowDoneAfter = false;
    }
    if (!rowDoneBefore && rowDoneAfter) {
      for (var c2 = 0; c2 < size; c2++) toFlash.push(row * size + c2);
    }

    // Check col
    var colDoneBefore = true;
    var colDoneAfter = true;
    for (var r = 0; r < size; r++) {
      if (prevCells[r * size + col] === 0) colDoneBefore = false;
      if (nextCells[r * size + col] === 0) colDoneAfter = false;
    }
    if (!colDoneBefore && colDoneAfter) {
      for (var r2 = 0; r2 < size; r2++) toFlash.push(r2 * size + col);
    }

    // Check box
    var boxDoneBefore = true;
    var boxDoneAfter = true;
    for (var dr = 0; dr < brSize; dr++) {
      for (var dc = 0; dc < bcSize; dc++) {
        var bIdx = (boxR + dr) * size + (boxC + dc);
        if (prevCells[bIdx] === 0) boxDoneBefore = false;
        if (nextCells[bIdx] === 0) boxDoneAfter = false;
      }
    }
    if (!boxDoneBefore && boxDoneAfter) {
      for (var dr2 = 0; dr2 < brSize; dr2++) {
        for (var dc2 = 0; dc2 < bcSize; dc2++) {
          toFlash.push((boxR + dr2) * size + (boxC + dc2));
        }
      }
    }

    for (var i = 0; i < toFlash.length; i++) {
      (function (idx) {
        var el = getCellEl(idx);
        if (!el) return;
        el.classList.remove('is-line-flash');
        void el.offsetWidth;
        el.classList.add('is-line-flash');
        setTimeout(function () {
          el.classList.remove('is-line-flash');
        }, 780);
      })(toFlash[i]);
    }
  }

  /* ==================== WIN HANDLING ==================== */
  function handleWin() {
    var core = getCore();
    var data = getData();
    var levels = data.levels || [];
    var level = levels[currentLevelIndex] || { id: 'easy' };

    var earnedStars = core.stars(currentState.mistakes, currentState.hintsUsed);
    progress = core.recordWin(progress, level.id, currentLevelIndex, earnedStars, levels.length);
    core.saveProgress(safeGetStorage(), progress);

    // 同步更新首页关卡列表 DOM（锁与星级）
    renderLevels();

    if (winTimer) clearTimeout(winTimer);
    winTimer = setTimeout(function () {
      showWinOverlay(earnedStars);
    }, 700);
  }

  function showWinOverlay(earnedStars) {
    var data = getData();
    var levels = data.levels || [];
    var overlay = document.getElementById('win-overlay');
    if (!overlay) return;

    var praise = pickRandom(data.praise, '太棒了！');
    var praiseEl = document.getElementById('win-praise-text');
    if (praiseEl) praiseEl.textContent = praise;

    var starEls = document.querySelectorAll('#win-stars .star');
    for (var i = 0; i < starEls.length; i++) {
      if (i < earnedStars) {
        starEls[i].classList.add('is-on');
      } else {
        starEls[i].classList.remove('is-on');
      }
    }

    var nextBtn = document.getElementById('btn-next');
    if (nextBtn) {
      var isLastLevel = currentLevelIndex >= levels.length - 1;
      var labelSpan = nextBtn.querySelector('.win-btn-label');
      if (labelSpan) {
        labelSpan.textContent = isLastLevel ? '再玩一次' : '下一关';
      } else {
        nextBtn.textContent = isLastLevel ? '再玩一次' : '下一关';
      }
    }

    spawnConfetti();
    overlay.removeAttribute('hidden');
    playWinChord();
    speakText(praise);
  }

  function spawnConfetti() {
    var container = document.getElementById('confetti-layer');
    if (!container) return;
    container.innerHTML = '';
    var colors = ['#F29544', '#5FB3C9', '#F6B5C0', '#FFE7A3', '#6A9C5B', '#9B6BB3'];
    for (var i = 0; i < 28; i++) {
      var p = document.createElement('span');
      p.className = 'confetti-piece';
      p.style.left = ((i * 3.6 + (i % 3) * 2) % 98) + '%';
      p.style.backgroundColor = colors[i % colors.length];
      p.style.animationDelay = ((i % 7) * 0.12) + 's';
      p.style.animationDuration = (2.1 + (i % 5) * 0.22) + 's';
      container.appendChild(p);
    }
  }

  /* ==================== KEYBOARD SUPPORT ==================== */
  function onKeyDown(e) {
    var gameScreen = document.getElementById('screen-game');
    if (!gameScreen || gameScreen.hasAttribute('hidden') || !currentState || currentState.done) {
      return;
    }
    var overlay = document.getElementById('win-overlay');
    if (overlay && !overlay.hasAttribute('hidden')) {
      return;
    }

    var size = currentState.size;
    var key = e.key;

    if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
      e.preventDefault();
      var start = selectedIdx >= 0 ? selectedIdx : 0;
      var r = Math.floor(start / size);
      var c = start % size;
      var dr = key === 'ArrowUp' ? -1 : key === 'ArrowDown' ? 1 : 0;
      var dc = key === 'ArrowLeft' ? -1 : key === 'ArrowRight' ? 1 : 0;

      for (var step = 0; step < size * size; step++) {
        r = (r + dr + size) % size;
        c = (c + dc + size) % size;
        var cand = r * size + c;
        if (currentState.puzzle[cand] === 0 && currentState.cells[cand] === 0) {
          onCellClick(cand);
          var el = getCellEl(cand);
          if (el) el.focus();
          break;
        }
        if (dr === 0 && dc !== 0 && step % size === size - 1) {
          r = (r + 1) % size;
        } else if (dc === 0 && dr !== 0 && step % size === size - 1) {
          c = (c + 1) % size;
        }
      }
      return;
    }

    var num = parseInt(key, 10);
    if ( num >= 1 && num <= size && selectedIdx >= 0) {
      e.preventDefault();
      onPaletteClick(num);
    }
  }

  /* ==================== INITIALIZATION ==================== */
  function bindStaticEvents() {
    var btnHome = document.getElementById('btn-home');
    if (btnHome) {
      btnHome.addEventListener('click', goHome);
    }

    var btnHint = document.getElementById('btn-hint');
    if (btnHint) {
      btnHint.addEventListener('click', onHintClick);
    }

    var btnSound = document.getElementById('btn-sound');
    if (btnSound) {
      btnSound.addEventListener('click', toggleSound);
    }

    var btnNext = document.getElementById('btn-next');
    if (btnNext) {
      btnNext.addEventListener('click', function () {
        var data = getData();
        var levels = data.levels || [];
        if (currentLevelIndex < levels.length - 1) {
          startGame(currentLevelIndex + 1);
        } else {
          startGame(currentLevelIndex);
        }
      });
    }

    var btnAgain = document.getElementById('btn-again');
    if (btnAgain) {
      btnAgain.addEventListener('click', function () {
        startGame(currentLevelIndex);
      });
    }

    var btnWinHome = document.getElementById('btn-win-home');
    if (btnWinHome) {
      btnWinHome.addEventListener('click', goHome);
    }

    document.addEventListener('keydown', onKeyDown);
  }

  function initApp() {
    var core = getCore();
    loadSettings();
    applyThemeAccent();
    updateSoundButtonUI();

    if (core && typeof core.loadProgress === 'function') {
      progress = core.loadProgress(safeGetStorage());
    } else {
      progress = { v: 1, unlocked: 1, stars: {}, wins: {} };
    }

    bindStaticEvents();
    renderThemes();
    renderLevels();
    showScreen('screen-home');
  }

  // 测试钩子（必须有）：window.SudokuApp = { start(levelIndex, seed), getState(), getProgress() }
  root.SudokuApp = {
    start: function (levelIndex, seed) {
      startGame(levelIndex, seed);
      return currentState;
    },
    getState: function () {
      return currentState;
    },
    getProgress: function () {
      return progress;
    }
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

  </script>
</body>
</html>
