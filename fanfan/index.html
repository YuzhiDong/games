<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>认汉字翻翻乐</title>
  <style>
/* ==========================================================================
   认汉字翻翻乐 — 剪纸拼贴绘本风 (Cut-Paper Picture Book Style)
   Palette & Visual System per spec v1
   ========================================================================== */

:root {
  --bg-cream: #FFF6E5;
  --paper-light: #FFFDF7;
  --ink: #3B2A20;
  --ink-soft: #6E5646;
  --tomato: #FF6B4A;
  --leaf: #3FA37C;
  --sky: #4AA8FF;
  --sun: #FFC43D;
  --blush: #FFD6CC;
  --stone-locked: #D8CFC2;
  --stone-locked-dark: #B5A999;

  --font-kaiti: "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif SC", serif;
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;

  --card-radius: 18px;
  --border-ink: 2px solid var(--ink);
  --shadow-hard: 4px 4px 0 var(--ink);
  --shadow-hard-lg: 6px 6px 0 var(--ink);
  --shadow-hard-press: 1px 1px 0 var(--ink);
  --flip-duration: 350ms;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background-color: var(--bg-cream);
  color: var(--ink);
  font-family: var(--font-ui);
}

/* Paper grain texture + subtle dot-and-fiber background */
body {
  position: relative;
  background-image:
    radial-gradient(rgba(59, 42, 32, 0.045) 1.25px, transparent 1.25px),
    radial-gradient(rgba(255, 196, 61, 0.09) 1.5px, transparent 1.5px),
    linear-gradient(180deg, #FFF6E5 0%, #FFF1D6 100%);
  background-size: 26px 26px, 42px 42px, 100% 100%;
  background-position: 0 0, 13px 17px, 0 0;
}

[hidden] {
  display: none !important;
}

/* ==========================================================================
   Cut-Paper Background Collage Decorations (Clouds, Hills, Grass)
   ========================================================================== */

.paper-stage {
  position: relative;
  min-height: 100dvh;
  width: 100%;
  max-width: 100vw;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.deco-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.cutout-cloud {
  position: absolute;
  filter: drop-shadow(4px 4px 0 var(--ink));
}

.cutout-cloud--left {
  top: 14px;
  left: -18px;
  width: clamp(110px, 20vw, 175px);
  transform: rotate(-4deg);
}

.cutout-cloud--right {
  top: 22px;
  right: -16px;
  width: clamp(105px, 18vw, 165px);
  transform: rotate(5deg);
}

.cutout-grass {
  position: absolute;
  bottom: -8px;
  filter: drop-shadow(4px -3px 0 var(--ink));
}

.cutout-grass--left {
  left: -14px;
  width: clamp(120px, 24vw, 210px);
}

.cutout-grass--right {
  right: -14px;
  width: clamp(120px, 24vw, 210px);
}

/* ==========================================================================
   Screens Common
   ========================================================================== */

.screen {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 960px;
  min-height: 100dvh;
  padding: 16px 16px 32px;
  display: none;
  flex-direction: column;
  align-items: center;
}

.screen.is-active {
  display: flex;
}

/* ==========================================================================
   Cut-Paper Reusable Button Styles (Touch Target >= 88px)
   ========================================================================== */

.btn-cutout {
  min-width: 88px;
  min-height: 88px;
  padding: 10px 16px;
  border: var(--border-ink);
  border-radius: 22px;
  background: var(--paper-light);
  color: var(--ink);
  box-shadow: var(--shadow-hard);
  font-family: var(--font-kaiti);
  font-size: 1.25rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform 120ms ease, box-shadow 120ms ease;
}

.btn-cutout:hover {
  transform: translate(-1px, -1px) rotate(-1deg);
}

.btn-cutout:active {
  transform: translate(3px, 3px);
  box-shadow: var(--shadow-hard-press);
}

.btn-cutout:focus-visible,
.level-btn:focus-visible,
.card:focus-visible {
  outline: 3px dashed var(--tomato);
  outline-offset: 4px;
}

.btn-cutout .btn-icon {
  font-size: 1.9rem;
  line-height: 1;
}

.btn-cutout .btn-label {
  font-size: 0.95rem;
  line-height: 1.1;
  letter-spacing: 0.04em;
}

/* ==========================================================================
   1. Home Screen (#screen-home)
   ========================================================================== */

.home-header {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin-top: 6px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.home-hero-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 24px 14px;
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 28px 22px 26px 20px;
  box-shadow: var(--shadow-hard-lg);
  transform: rotate(-1.2deg);
}

.home-hero-badge::before {
  content: "";
  position: absolute;
  inset: -7px;
  z-index: -1;
  background: var(--blush);
  border: 2px solid var(--ink);
  border-radius: 30px 24px 28px 24px;
  transform: rotate(2.2deg);
}

.sun-deco {
  width: 68px;
  height: 68px;
  flex-shrink: 0;
  filter: drop-shadow(3px 3px 0 var(--ink));
  animation: sun-wobble 5s ease-in-out infinite;
}

@keyframes sun-wobble {
  0%, 100% { transform: rotate(-4deg) scale(1); }
  50% { transform: rotate(6deg) scale(1.05); }
}

.home-title {
  margin: 0;
  font-family: var(--font-kaiti);
  font-size: clamp(2rem, 6.2vw, 3.1rem);
  font-weight: 900;
  color: var(--ink);
  letter-spacing: 0.06em;
  text-shadow: 2px 2px 0 var(--paper-light);
  line-height: 1.15;
}

.home-subtitle {
  margin: 14px 0 0;
  padding: 5px 16px;
  background: var(--paper-light);
  border: var(--border-ink);
  border-radius: 999px;
  box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--font-kaiti);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  transform: rotate(0.8deg);
}

/* Winding Stepping-Stone Trail */
.stone-trail-wrap {
  position: relative;
  width: 100%;
  max-width: 620px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 6px 24px;
}

.trail-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.stone-trail {
  position: relative;
  z-index: 1;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 22px;
  justify-items: center;
  align-items: center;
}

/* Winding stone offsets to create an S-curve picture-book path */
.level-btn {
  position: relative;
  min-width: 132px;
  min-height: 112px;
  width: clamp(132px, 38vw, 176px);
  padding: 12px 14px 10px;
  border: 3px solid var(--ink);
  border-radius: 46% 54% 48% 52% / 44% 48% 52% 56%;
  background: var(--paper-light);
  color: var(--ink);
  box-shadow: 5px 6px 0 var(--ink);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform 160ms ease, box-shadow 160ms ease;
}

.level-btn[data-level="0"] {
  background: #FFF8D6;
  transform: translateX(-8px) rotate(-2deg);
}
.level-btn[data-level="1"] {
  background: var(--blush);
  transform: translateX(8px) translateY(10px) rotate(2deg);
  border-radius: 52% 48% 45% 55% / 48% 54% 46% 52%;
}
.level-btn[data-level="2"] {
  background: #DDF7EC;
  transform: translateX(10px) rotate(1.6deg);
  border-radius: 48% 52% 54% 46% / 52% 45% 55% 48%;
}
.level-btn[data-level="3"] {
  background: #E1F2FF;
  transform: translateX(-10px) translateY(8px) rotate(-1.8deg);
}
.level-btn[data-level="4"] {
  background: #FFE7C7;
  transform: translateX(-6px) rotate(-1.4deg);
  border-radius: 54% 46% 50% 50% / 46% 52% 48% 54%;
}
.level-btn[data-level="5"] {
  background: #FFE0EC;
  transform: translateX(8px) translateY(8px) rotate(2.1deg);
}

.level-btn:not(.is-locked):hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 7px 8px 0 var(--ink);
}

.level-btn:not(.is-locked):active {
  transform: translate(3px, 3px);
  box-shadow: 2px 2px 0 var(--ink);
}

.level-num-pill {
  position: absolute;
  top: -10px;
  left: 10px;
  min-width: 28px;
  height: 28px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--tomato);
  color: #fff;
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  font-family: var(--font-kaiti);
  font-size: 0.95rem;
  font-weight: 900;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.level-emoji {
  font-size: 2.35rem;
  line-height: 1.05;
  filter: drop-shadow(2px 2px 0 rgba(59, 42, 32, 0.18));
}

.level-name {
  font-family: var(--font-kaiti);
  font-size: 1.2rem;
  font-weight: 900;
  line-height: 1.1;
  color: var(--ink);
}

.level-stars {
  display: inline-flex;
  gap: 3px;
  font-size: 1.05rem;
  line-height: 1;
  margin-top: 2px;
}

.star-slot {
  color: #D7CABB;
  text-shadow: 1px 1px 0 var(--ink);
}

.star-slot.is-lit {
  color: var(--sun);
}

/* Locked stone appearance */
.level-btn.is-locked {
  background: var(--stone-locked);
  color: #7A6E63;
  box-shadow: 4px 4px 0 var(--ink);
}

.level-btn.is-locked .level-num-pill {
  background: var(--stone-locked-dark);
  color: var(--ink);
}

.level-btn.is-locked .level-emoji {
  filter: grayscale(0.95) opacity(0.65);
}

.level-lock-badge {
  position: absolute;
  top: -10px;
  right: 8px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--paper-light);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}

/* ==========================================================================
   2. Game Screen (#screen-game)
   ========================================================================== */

.game-topbar {
  width: 100%;
  max-width: 820px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

#btn-home {
  background: var(--blush);
}

#btn-sound {
  background: var(--sun);
}

#btn-sound[aria-pressed="false"] {
  background: var(--stone-locked);
}

.game-status-banner {
  flex: 1;
  min-height: 88px;
  padding: 10px 14px;
  background: var(--paper-light);
  border: var(--border-ink);
  border-radius: 22px;
  box-shadow: var(--shadow-hard);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transform: rotate(-0.6deg);
}

.game-level-title {
  margin: 0;
  font-family: var(--font-kaiti);
  font-size: clamp(1.3rem, 4vw, 1.75rem);
  font-weight: 900;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.game-moves-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 12px;
  border-radius: 999px;
  background: var(--bg-cream);
  border: 1.5px solid var(--ink);
  font-family: var(--font-kaiti);
  font-size: 1.05rem;
  font-weight: 700;
}

#moves {
  display: inline-block;
  min-width: 1.4em;
  text-align: center;
  font-family: var(--font-ui);
  font-weight: 900;
  color: var(--tomato);
}

/* ==========================================================================
   Card Board (#board) & Thick Cut-Paper Cards (.card)
   ========================================================================== */

#board {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(88px, 1fr));
  gap: 12px;
  align-content: center;
  justify-items: center;
  padding: 4px 2px 18px;
}

/* Widescreen: 4 columns (6 pairs = 12 cards -> 4x3) */
@media (min-width: 681px) {
  #board {
    max-width: 720px;
    grid-template-columns: repeat(4, minmax(110px, 1fr));
    gap: 16px;
  }

  .stone-trail {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
  }
}

.card {
  position: relative;
  width: 100%;
  min-width: 88px;
  min-height: 98px;
  aspect-ratio: 3 / 3.45;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  perspective: 900px;
  container-type: inline-size;
  transform: rotate(var(--card-rot, 0deg));
  transition: opacity 320ms ease, transform 220ms ease;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform var(--flip-duration) cubic-bezier(0.34, 1.4, 0.64, 1);
}

.card.is-open .card-inner,
.card.is-matched .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--card-radius);
  border: var(--border-ink);
  box-shadow: var(--shadow-hard);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Card Back: Sun Yellow with hand-drawn polka dots & center flower medallion */
.card-back {
  background-color: var(--sun);
  background-image:
    radial-gradient(var(--paper-light) 2.5px, transparent 2.5px),
    radial-gradient(var(--tomato) 2px, transparent 2px);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}

.card-back::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 2px dashed var(--ink);
  border-radius: 12px;
  pointer-events: none;
  opacity: 0.65;
}

.card-back-flower {
  width: 44%;
  max-width: 56px;
  aspect-ratio: 1;
  filter: drop-shadow(2px 2px 0 var(--ink));
}

/* Card Front: Thick warm cream cardstock */
.card-front {
  background: var(--paper-light);
  transform: rotateY(180deg);
  padding: 6px;
}

.card[data-face="char"] .card-front {
  background:
    linear-gradient(180deg, #FFFDF9 0%, #FFF5E4 100%);
}

.card[data-face="pic"] .card-front {
  background:
    linear-gradient(180deg, #FFFDF9 0%, #FFEFE8 100%);
}

.card-front::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1.5px solid rgba(59, 42, 32, 0.16);
  border-radius: 13px;
  pointer-events: none;
}

/* Corner registration sticker */
.card-corner-dot {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: var(--sky);
}

.card[data-face="char"] .card-corner-dot {
  background: var(--tomato);
}

/* Hanzi Card typography: Pinyin on top, Kaiti Hanzi ~55% of card width */
.card-pinyin {
  font-family: var(--font-ui);
  font-size: clamp(0.78rem, 13cqi, 1.05rem);
  font-weight: 700;
  color: var(--ink-soft);
  line-height: 1.1;
  margin-bottom: 2px;
  letter-spacing: 0.02em;
}

.card-hanzi {
  font-family: var(--font-kaiti);
  font-size: clamp(2.1rem, 11vw, 3.8rem);
  font-size: 55cqi;
  font-weight: 900;
  line-height: 1.05;
  color: var(--ink);
  text-shadow: 2px 2px 0 var(--blush);
}

/* Picture Card content: Large Emoji + Hanzi retention tag */
.card-emoji {
  font-size: clamp(2.2rem, 11vw, 3.8rem);
  font-size: 52cqi;
  line-height: 1.05;
  filter: drop-shadow(2px 3px 0 rgba(59, 42, 32, 0.2));
  transition: transform 240ms ease;
}

.card-word-chip {
  margin-top: 3px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--sun);
  border: 1.5px solid var(--ink);
  font-family: var(--font-kaiti);
  font-size: clamp(0.82rem, 14cqi, 1.05rem);
  font-weight: 900;
  color: var(--ink);
  line-height: 1.15;
}

/* Matched state: hop animation, then semi-transparent after ~600ms while preserving Hanzi */
.card.is-matched {
  animation: card-match-hop 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.card.is-matched .card-front {
  border-color: var(--leaf);
  box-shadow: 4px 4px 0 var(--leaf);
}

.card.is-matched.is-settled-match {
  opacity: 0.58;
}

/* Mismatch / Locked Shake Animation */
.card.is-mismatch,
.level-btn.is-shaking {
  animation: paper-shake 420ms ease-in-out;
}

@keyframes card-match-hop {
  0% { transform: rotate(var(--card-rot, 0deg)) scale(1); }
  40% { transform: rotate(0deg) translateY(-10px) scale(1.08); }
  75% { transform: rotate(var(--card-rot, 0deg)) translateY(2px) scale(0.98); }
  100% { transform: rotate(var(--card-rot, 0deg)) scale(1); }
}

@keyframes paper-shake {
  0%, 100% { transform: translateX(0) rotate(var(--card-rot, 0deg)); }
  20% { transform: translateX(-8px) rotate(-4deg); }
  40% { transform: translateX(8px) rotate(4deg); }
  60% { transform: translateX(-6px) rotate(-3deg); }
  80% { transform: translateX(6px) rotate(3deg); }
}

/* ==========================================================================
   3. Win Overlay (#win-overlay) & Confetti
   ========================================================================== */

#win-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(59, 42, 32, 0.58);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

#win-overlay.is-visible {
  display: flex;
}

.confetti-box {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -24px;
  width: 14px;
  height: 20px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  animation: confetti-fall 2200ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

@keyframes confetti-fall {
  0% {
    transform: translateY(-20px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(92vh) rotate(520deg);
    opacity: 0;
  }
}

.win-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 420px;
  padding: 26px 22px 22px;
  background: var(--bg-cream);
  border: 3px solid var(--ink);
  border-radius: 28px;
  box-shadow: 8px 8px 0 var(--ink);
  text-align: center;
  transform: rotate(-1deg);
}

.win-banner {
  display: inline-block;
  margin: 0 0 10px;
  padding: 6px 22px;
  background: var(--tomato);
  color: #fff;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--font-kaiti);
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 0.06em;
}

#win-stars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 14px 0 20px;
  min-height: 68px;
}

.win-star {
  font-size: 3.4rem;
  line-height: 1;
  color: #D9CFC2;
  text-shadow: 3px 3px 0 var(--ink);
  transform: scale(0.2);
  opacity: 0;
}

.win-star.is-popped {
  opacity: 1;
  transform: scale(1) rotate(var(--star-rot, -5deg));
  transition: transform 320ms cubic-bezier(0.34, 1.65, 0.64, 1), opacity 200ms ease;
}

.win-star.is-earned {
  color: var(--sun);
}

.win-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

#btn-next {
  background: var(--leaf);
  color: #fff;
  min-width: 142px;
}

#btn-win-home {
  background: var(--blush);
  min-width: 118px;
}

/* ==========================================================================
   Reduced Motion Preference (prefers-reduced-motion: reduce)
   ========================================================================== */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .card-inner {
    transition: none !important;
  }

  .confetti-box {
    display: none !important;
  }
}

      '<circle cx="15" cy="25" r="10" fill="#FFFDF7"/>' +
      '<circle cx="32" cy="32" r="11" fill="#FF6B4A"/>' +
      '<circle cx="29" cy="30" r="2" fill="#3B2A20" stroke="none"/>' +
      '<circle cx="35" cy="30" r="2" fill="#3B2A20" stroke="none"/>' +
      '<path d="M28 35 Q32 39 36 35" fill="none" stroke="#3B2A20" stroke-width="2.2" stroke-linecap="round"/>' +
      '</g>' +
      '</svg>'
    );
  }

  var app = {
    soundEnabled: true,
    progress: null,
    currentLevelIndex: 0,
    state: null,
    timers: [],

    clearTimers: function () {
      while (this.timers.length > 0) {
        clearTimeout(this.timers.pop());
      }
    },

    addTimer: function (fn, delay) {
      var id = setTimeout(fn, delay);
      this.timers.push(id);
      return id;
    }
  };

  function getLevels() {
    return (window.FAN_DATA && Array.isArray(window.FAN_DATA.levels))
      ? window.FAN_DATA.levels
      : [];
  }

  function renderSoundButton() {
    var btn = document.getElementById('btn-sound');
    var icon = document.getElementById('sound-icon');
    var label = document.getElementById('sound-label');
    if (!btn) return;
    btn.setAttribute('aria-pressed', app.soundEnabled ? 'true' : 'false');
    if (icon) icon.textContent = app.soundEnabled ? '🔊' : '🔇';
    if (label) label.textContent = app.soundEnabled ? '有声音' : '静音';
  }

  function renderHome() {
    var trail = document.getElementById('stone-trail');
    if (!trail) return;

    var levels = getLevels();
    var unlockedCount = (app.progress && typeof app.progress.unlocked === 'number')
      ? app.progress.unlocked
      : 1;
    var starsMap = (app.progress && app.progress.stars) ? app.progress.stars : {};

    trail.innerHTML = '';

    levels.forEach(function (level, idx) {
      var isUnlocked = idx < unlockedCount;
      // progress.stars is keyed by level INDEX (recordWin takes levelIndex)
      var starCount = Number(starsMap[idx] || starsMap[String(idx)] || 0);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn' + (isUnlocked ? '' : ' is-locked');
      btn.setAttribute('data-level', String(idx));
      btn.setAttribute('data-level-id', String(level.id));
      btn.setAttribute('role', 'listitem');
      btn.setAttribute('aria-disabled', isUnlocked ? 'false' : 'true');
      btn.setAttribute(
        'aria-label',
        '第' + (idx + 1) + '关 ' + level.name + (isUnlocked ? '，已得' + starCount + '颗星' : '，未解锁')
      );

      var starsHtml = '';
      for (var s = 1; s <= 3; s++) {
        starsHtml +=
          '<span class="star-slot' + (s <= starCount ? ' is-lit' : '') + '" aria-hidden="true">' +
          (s <= starCount ? '★' : '☆') +
          '</span>';
      }

      var lockBadgeHtml = isUnlocked
        ? ''
        : '<span class="level-lock-badge" aria-hidden="true">🔒</span>';

      btn.innerHTML =
        '<span class="level-num-pill">' + (idx + 1) + '</span>' +
        lockBadgeHtml +
        '<span class="level-emoji" aria-hidden="true">' + level.emoji + '</span>' +
        '<span class="level-name">' + level.name + '</span>' +
        '<span class="level-stars" aria-label="' + starCount + '星">' + starsHtml + '</span>';

      btn.addEventListener('click', function () {
        if (!isUnlocked) {
          btn.classList.remove('is-shaking');
          // Trigger reflow to restart shake animation on repeated clicks
          void btn.offsetWidth;
          btn.classList.add('is-shaking');
          app.addTimer(function () {
            btn.classList.remove('is-shaking');
          }, 450);
          return;
        }
        startLevel(idx);
      });

      trail.appendChild(btn);
    });
  }

  function showScreen(screenId) {
    var home = document.getElementById('screen-home');
    var game = document.getElementById('screen-game');
    if (!home || !game) return;

    if (screenId === 'home') {
      home.hidden = false;
      home.classList.add('is-active');
      game.hidden = true;
      game.classList.remove('is-active');
    } else {
      home.hidden = true;
      home.classList.remove('is-active');
      game.hidden = false;
      game.classList.add('is-active');
    }
  }

  function hideWinOverlay() {
    var overlay = document.getElementById('win-overlay');
    var confetti = document.getElementById('confetti-box');
    if (overlay) {
      overlay.classList.remove('is-visible');
      overlay.hidden = true;
    }
    if (confetti) {
      confetti.innerHTML = '';
    }
  }

  function startLevel(levelIndex) {
    var levels = getLevels();
    var level = levels[levelIndex];
    if (!level || !window.FanGame) return;

    app.clearTimers();
    hideWinOverlay();
    app.currentLevelIndex = levelIndex;

    var seed = (Date.now() & 0xffffffff) >>> 0;
    var rng = window.FanGame.makeRng(seed);
    app.state = window.FanGame.createGame(level, rng);

    var titleEl = document.getElementById('level-title');
    if (titleEl) {
      titleEl.textContent = level.emoji + ' ' + level.name;
    }

    var movesEl = document.getElementById('moves');
    if (movesEl) {
      movesEl.textContent = '0';
    }

    renderBoard(rng);
    showScreen('game');
  }

  function renderBoard(rng) {
    var board = document.getElementById('board');
    if (!board || !app.state) return;

    board.innerHTML = '';
    board.setAttribute('data-pairs', String(app.state.pairs));

    app.state.cards.forEach(function (card, idx) {
      var cardBtn = document.createElement('button');
      cardBtn.type = 'button';
      cardBtn.className = 'card';
      cardBtn.setAttribute('data-id', String(card.id));
      cardBtn.setAttribute('data-key', String(card.key));
      cardBtn.setAttribute('data-face', String(card.face));
      cardBtn.setAttribute('aria-label', '第' + (idx + 1) + '张牌');

      // Deterministic/seeded slight rotation between -2deg and +2deg
      var rVal = rng ? (rng() * 4 - 2) : (((idx * 37) % 41) - 20) / 10;
      if (Math.abs(rVal) < 0.35) {
        rVal = rVal < 0 ? -0.85 : 0.85;
      }
      cardBtn.style.setProperty('--card-rot', rVal.toFixed(2) + 'deg');

      var frontContent = '';
      if (card.face === 'char') {
        frontContent =
          '<span class="card-corner-dot" aria-hidden="true"></span>' +
          '<span class="card-pinyin">' + card.pinyin + '</span>' +
          '<span class="card-hanzi">' + card.char + '</span>';
      } else {
        frontContent =
          '<span class="card-corner-dot" aria-hidden="true"></span>' +
          '<span class="card-emoji" role="img" aria-label="' + card.word + '">' + card.emoji + '</span>' +
          '<span class="card-word-chip">' + card.char + '</span>';
      }

      cardBtn.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back">' +
            getCardBackFlowerSvg() +
          '</div>' +
          '<div class="card-face card-front">' +
            frontContent +
          '</div>' +
        '</div>';

      cardBtn.addEventListener('click', function () {
        onCardClick(card.id);
      });

      board.appendChild(cardBtn);
    });
  }

  function getCardElement(id) {
    var board = document.getElementById('board');
    if (!board) return null;
    return board.querySelector('.card[data-id="' + id + '"]');
  }

  function syncMoves() {
    var movesEl = document.getElementById('moves');
    if (movesEl && app.state) {
      movesEl.textContent = String(app.state.moves);
    }
  }

  function onCardClick(cardId) {
    if (!app.state || !window.FanGame) return;

    var prevMatched = app.state.matched ? app.state.matched.slice() : [];
    var result = window.FanGame.flip(app.state, cardId);
    if (!result || result.event === 'ignored') {
      return;
    }

    app.state = result.state;
    syncMoves();

    var clickedCard = app.state.cards[cardId];
    var clickedEl = getCardElement(cardId);
    if (clickedEl) {
      clickedEl.classList.add('is-open');
    }

    speakCard(clickedCard);

    if (result.event === 'flip') {
      return;
    }

    if (result.event === 'match' || result.event === 'win') {
      // Identify newly matched cards (by key or matched array diff)
      var newlyMatchedEls = [];
      app.state.cards.forEach(function (c) {
        var isNowMatched =
          app.state.matched.indexOf(c.id) !== -1 ||
          app.state.matched.indexOf(c.key) !== -1 ||
          c.key === clickedCard.key;
        var wasMatched =
          prevMatched.indexOf(c.id) !== -1 ||
          prevMatched.indexOf(c.key) !== -1;

        if (isNowMatched && (!wasMatched || c.key === clickedCard.key)) {
          var el = getCardElement(c.id);
          if (el && !el.classList.contains('is-matched')) {
            el.classList.add('is-open', 'is-matched');
            newlyMatchedEls.push(el);
          }
        }
      });

      playDing();

      app.addTimer(function () {
        newlyMatchedEls.forEach(function (el) {
          el.classList.add('is-settled-match');
        });
      }, 600);

      if (result.event === 'win') {
        handleWin();
      }
      return;
    }

    if (result.event === 'mismatch') {
      var openIds = app.state.open ? app.state.open.slice() : [];
      openIds.forEach(function (id) {
        var el = getCardElement(id);
        if (el) {
          el.classList.add('is-open', 'is-mismatch');
        }
      });

      app.addTimer(function () {
        if (!app.state || !window.FanGame) return;
        app.state = window.FanGame.settle(app.state);
        openIds.forEach(function (id) {
          var el = getCardElement(id);
          if (el && !el.classList.contains('is-matched')) {
            el.classList.remove('is-open', 'is-mismatch');
          }
        });
      }, 900);
    }
  }

  function spawnConfetti() {
    if (prefersReducedMotion()) return;
    var box = document.getElementById('confetti-box');
    if (!box) return;
    box.innerHTML = '';

    var colors = ['#FF6B4A', '#3FA37C', '#4AA8FF', '#FFC43D', '#FFD6CC'];
    for (var i = 0; i < 28; i++) {
      var piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = ((i * 3.6 + (i % 3) * 2) % 98).toFixed(1) + '%';
      piece.style.backgroundColor = colors[i % colors.length];
      piece.style.animationDelay = ((i % 7) * 90) + 'ms';
      piece.style.animationDuration = (1700 + (i % 5) * 220) + 'ms';
      box.appendChild(piece);
    }
  }

  function handleWin() {
    var levels = getLevels();
    var earnedStars = window.FanGame.stars(app.state.moves, app.state.pairs);

    try {
      app.progress = window.FanGame.recordWin(
        app.progress,
        app.currentLevelIndex,
        earnedStars,
        levels.length
      );
      window.FanGame.saveProgress(safeStorage, app.progress);
    } catch (e) {
      // Ignore storage error
    }

    // Keep home stones synchronized with new unlock & star count
    renderHome();

    var overlay = document.getElementById('win-overlay');
    var starsBox = document.getElementById('win-stars');
    var nextLabel = document.getElementById('btn-next-label');
    var nextIcon = document.getElementById('btn-next-icon');

    var isLastLevel = app.currentLevelIndex >= levels.length - 1;
    if (nextLabel) {
      nextLabel.textContent = isLastLevel ? '再玩一次' : '下一关';
    }
    if (nextIcon) {
      nextIcon.textContent = isLastLevel ? '🔄' : '⏭️';
    }

    if (starsBox) {
      starsBox.innerHTML = '';
      starsBox.setAttribute('data-stars', String(earnedStars));
      var rotations = ['-8deg', '0deg', '8deg'];
      for (var i = 1; i <= 3; i++) {
        var starEl = document.createElement('span');
        var isEarned = i <= earnedStars;
        starEl.className = 'win-star' + (isEarned ? ' is-earned' : '');
        starEl.style.setProperty('--star-rot', rotations[i - 1]);
        starEl.textContent = isEarned ? '★' : '☆';
        starsBox.appendChild(starEl);

        (function (el, idx) {
          if (prefersReducedMotion()) {
            el.classList.add('is-popped');
          } else {
            app.addTimer(function () {
              el.classList.add('is-popped');
            }, idx * 160);
          }
        })(starEl, i);
      }
    }

    if (overlay) {
      overlay.hidden = false;
      overlay.classList.add('is-visible');
    }

    spawnConfetti();
    app.addTimer(function () {
      speakText('太棒了！', false);
    }, 280);
  }

  function bindGlobalEvents() {
    var btnHome = document.getElementById('btn-home');
    if (btnHome) {
      btnHome.addEventListener('click', function () {
        app.clearTimers();
        hideWinOverlay();
        renderHome();
        showScreen('home');
      });
    }

    var btnWinHome = document.getElementById('btn-win-home');
    if (btnWinHome) {
      btnWinHome.addEventListener('click', function () {
        app.clearTimers();
        hideWinOverlay();
        renderHome();
        showScreen('home');
      });
    }

    var btnNext = document.getElementById('btn-next');
    if (btnNext) {
      btnNext.addEventListener('click', function () {
        var levels = getLevels();
        var isLastLevel = app.currentLevelIndex >= levels.length - 1;
        var targetIndex = isLastLevel ? app.currentLevelIndex : app.currentLevelIndex + 1;
        startLevel(targetIndex);
      });
    }

    var btnSound = document.getElementById('btn-sound');
    if (btnSound) {
      btnSound.addEventListener('click', function () {
        app.soundEnabled = !app.soundEnabled;
        saveSoundEnabled(app.soundEnabled);
        renderSoundButton();
        if (!app.soundEnabled && 'speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
        }
      });
    }
  }

  function init() {
    app.soundEnabled = loadSoundEnabled();
    try {
      app.progress = window.FanGame
        ? window.FanGame.loadProgress(safeStorage)
        : { v: 1, unlocked: 1, stars: {} };
    } catch (e) {
      app.progress = { v: 1, unlocked: 1, stars: {} };
    }

    renderSoundButton();
    renderHome();
    bindGlobalEvents();
    showScreen('home');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
