<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小火车数数</title>
<style>:root {
  --sky: #7ec8e3;
  --grass: #6abf4b;
  --red: #e63946;
  --yellow: #ffcf3f;
  --cream: #fff4e0;
  --ink: #2b2d42;
  --brick: #d98e5f;
  --font: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--font);
  user-select: none;
}

[hidden] {
  display: none !important;
}

button {
  font-family: var(--font);
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 20px;
  min-width: 64px;
  min-height: 64px;
  padding: 8px 14px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  touch-action: manipulation;
}

button:active:not(:disabled) {
  transform: translateY(2px);
}

button:focus-visible {
  outline: 4px solid var(--yellow);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.72;
}

#app {
  position: relative;
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 12px 12px 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Scenery background */
.scenery {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.cloud {
  position: absolute;
  width: 120px;
  height: 60px;
}

.cloud-a {
  top: 22px;
  left: 8%;
}

.cloud-b {
  top: 52px;
  right: 12%;
}

.hills {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 38%;
}

/* Sound button */
#btn-sound {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 20;
  width: 64px;
  height: 64px;
  padding: 8px;
  border-radius: 18px;
  background: var(--cream);
}

#btn-sound svg {
  width: 40px;
  height: 40px;
}

section[data-screen] {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

/* Home screen */
section[data-screen="home"] {
  padding-top: 8px;
  gap: 12px;
}

#title {
  margin: 8px 0 0;
  padding: 8px 22px;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 24px;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 900;
  letter-spacing: 2px;
  text-align: center;
}

#home-train {
  width: 100%;
  max-width: 520px;
  display: flex;
  justify-content: center;
}

.home-train-scene {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#btn-play {
  min-width: 200px;
  min-height: 76px;
  padding: 12px 36px;
  font-size: 32px;
  font-weight: 900;
  background: var(--yellow);
  border-width: 3px;
  border-radius: 28px;
}

#btn-stickers {
  min-width: 160px;
  min-height: 64px;
  padding: 10px 24px;
  font-size: 22px;
  font-weight: 900;
  background: var(--cream);
  border-radius: 22px;
}

#level-grid {
  width: 100%;
  max-width: 640px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-top: 4px;
}

@media (max-width: 420px) {
  #level-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }
}

button.level {
  min-width: 64px;
  min-height: 76px;
  padding: 6px 4px;
  border-radius: 18px;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

button.level.completed {
  background: var(--yellow);
}

button.level.locked {
  background: #d8e2dc;
}

.level-num {
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
}

.mini-head,
.level-lock {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.mini-head svg,
.level-lock svg {
  width: 100%;
  height: 100%;
}

/* Play Screen */
section[data-screen="play"] {
  justify-content: space-between;
  gap: 10px;
  padding-right: 0;
}

.play-bar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 72px;
}

#btn-home,
#btn-say,
#btn-book-home {
  width: 64px;
  height: 64px;
  padding: 8px;
  flex-shrink: 0;
  background: var(--cream);
}

#btn-home svg,
#btn-say svg,
#btn-book-home svg {
  width: 40px;
  height: 40px;
}

#prompt-text {
  flex: 1;
  margin: 0;
  padding: 10px 14px;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 20px;
  font-size: clamp(20px, 4.5vw, 28px);
  font-weight: 900;
  text-align: center;
}

/* Rail & Train */
#rail {
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  min-height: 170px;
  overflow: hidden;
  padding-top: 12px;
}

.train-stage {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.train-stage.entering {
  animation: train-enter 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.train-stage.departing {
  animation: train-depart 0.68s cubic-bezier(0.5, 0, 0.85, 0.4) forwards;
}

.train-stage.entering .wheel,
.train-stage.departing .wheel,
.train-stage.entering .car-wheel,
.train-stage.departing .car-wheel {
  animation: wheel-spin 0.45s linear infinite;
}

@keyframes train-enter {
  from {
    transform: translateX(-110%);
  }
  to {
    transform: translateX(0);
  }
}

@keyframes train-depart {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(115%);
  }
}

@keyframes wheel-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.train-assembly {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  max-width: 100%;
  flex-wrap: nowrap;
}

.cars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.car {
  position: relative;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 16px;
  padding: 6px 6px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.car-roof {
  width: calc(100% + 8px);
  height: 8px;
  background: var(--red);
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  margin-top: -10px;
  margin-bottom: 4px;
}

.car-body {
  display: flex;
  align-items: center;
  gap: 4px;
}

@media (max-width: 680px) {
  .train-assembly {
    flex-wrap: wrap;
  }
}

.car-wheels {
  position: absolute;
  bottom: -11px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.car-wheel {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--yellow);
}

.loco-wrap {
  position: relative;
  width: 124px;
  height: 104px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
}

.loco {
  width: 100%;
  height: 100%;
  display: block;
}

.loco .wheel {
  transform-box: fill-box;
  transform-origin: center;
}

.deco-animal {
  width: 58px;
  height: 58px;
  display: inline-flex;
}

.deco-animal svg {
  width: 100%;
  height: 100%;
}

.rail-track {
  width: 100%;
  height: 12px;
  background: var(--brick);
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  margin-top: 8px;
}

/* Steam particles */
.steam-box {
  position: absolute;
  top: -18px;
  left: 52px;
  width: 40px;
  height: 40px;
  pointer-events: none;
}

.steam-puff {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--ink);
  animation: puff-rise 0.6s ease-out forwards;
  animation-delay: calc(var(--i, 0) * 0.05s);
}

@keyframes puff-rise {
  from {
    opacity: 0.95;
    transform: translate(0, 0) scale(0.6);
  }
  to {
    opacity: 0;
    transform: translate(-28px, -36px) scale(1.4);
  }
}

/* Platform & Passengers */
#platform {
  width: 100%;
  min-height: 170px;
  background: var(--brick);
  border: 3px solid var(--ink);
  border-radius: 24px;
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

button.passenger {
  width: 72px;
  height: 72px;
  min-width: 72px;
  min-height: 72px;
  padding: 4px;
  border-radius: 18px;
  background: var(--cream);
  border: 2.5px solid var(--ink);
}

.seat {
  width: 78px;
  height: 78px;
  background: var(--sky);
  border: 2.5px solid var(--ink);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.seat button.passenger {
  width: 72px;
  height: 72px;
  min-width: 72px;
  min-height: 72px;
  border-radius: 14px;
  background: var(--yellow);
}

button.passenger svg {
  width: 100%;
  height: 100%;
}

button.passenger.hop-up,
button.passenger.hop-down {
  animation: hop-pop 0.25s ease-out;
}

button.passenger.shake {
  animation: head-shake 0.32s ease-in-out;
}

@keyframes hop-pop {
  0% {
    transform: scale(0.75) translateY(10px);
  }
  60% {
    transform: scale(1.08) translateY(-6px);
  }
  100% {
    transform: scale(1) translateY(0);
  }
}

@keyframes head-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-8px) rotate(-6deg);
  }
  75% {
    transform: translateX(8px) rotate(6deg);
  }
}

/* HUD: Count Card & Go Flag */
#hud {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
}

#count-card {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 22px;
  padding: 6px 18px 10px;
  min-width: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#count-num {
  font-size: 72px;
  font-weight: 900;
  line-height: 1;
  color: var(--ink);
}

#count-dots {
  display: flex;
  gap: 6px;
  min-height: 16px;
  margin-top: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--grass);
  border: 2px solid var(--ink);
}

.dot.dot-extra {
  background: var(--red);
}

#btn-go {
  width: 84px;
  height: 84px;
  min-width: 84px;
  min-height: 84px;
  border-radius: 24px;
  background: #cfd8dc;
  filter: grayscale(0.85);
}

#btn-go svg {
  width: 52px;
  height: 52px;
}

#btn-go.ready {
  background: var(--yellow);
  filter: none;
  animation: flag-bounce 0.9s ease-in-out infinite;
}

@keyframes flag-bounce {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-5px);
  }
}

/* Reward Modal */
#reward {
  position: fixed;
  inset: 0;
  background: rgba(43, 45, 66, 0.55);
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#reward-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 28px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}

#reward-cheer {
  margin: 0;
  font-size: 36px;
  font-weight: 900;
  color: var(--red);
}

#reward-sticker {
  width: 150px;
  height: 150px;
}

#reward-sticker svg {
  width: 100%;
  height: 100%;
}

#confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -12px;
  width: 12px;
  height: 12px;
  border: 2px solid var(--ink);
  border-radius: 3px;
  animation: confetti-fall 1.1s ease-out forwards;
}

@keyframes confetti-fall {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  to {
    transform: translateY(280px) rotate(220deg);
    opacity: 0;
  }
}

#btn-next {
  width: 100%;
  min-height: 68px;
  font-size: 26px;
  font-weight: 900;
  background: var(--yellow);
}

#btn-reward-home {
  width: 100%;
  min-height: 64px;
  font-size: 22px;
  background: var(--cream);
}

/* Stickers Book Screen */
section[data-screen="stickers"] {
  gap: 14px;
}

.book-bar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 72px;
}

.book-bar h2 {
  margin: 0;
  padding: 10px 20px;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 20px;
  font-size: 28px;
  font-weight: 900;
}

#sticker-empty {
  margin: 0;
  padding: 12px 20px;
  background: var(--yellow);
  border: 3px solid var(--ink);
  border-radius: 20px;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
}

#sticker-book {
  width: 100%;
  max-width: 680px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

@media (max-width: 480px) {
  #sticker-book {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.sticker {
  aspect-ratio: 1 / 1;
  min-height: 92px;
  background: rgba(255, 244, 224, 0.55);
  border: 3px dashed var(--ink);
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}

.sticker.earned {
  background: var(--cream);
  border-style: solid;
}

.sticker svg {
  width: 100%;
  height: 100%;
}

.sticker-slot-num {
  font-size: 32px;
  font-weight: 900;
  opacity: 0.45;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* 窄屏火车：每节车厢一行、右对齐，车头挂在最后一节车厢右侧（不掉到车厢下方） */
@media (max-width: 680px) {
  .train-assembly { display: grid; grid-template-columns: auto auto; justify-content: center; align-items: end; column-gap: 3px; row-gap: 18px; }
  .cars { display: contents; }
  .car { grid-column: 1; justify-self: end; }
  .loco-wrap { grid-column: 2; grid-row: 1; width: 92px; height: 78px; }
  .train-assembly[data-cars="2"] .loco-wrap { grid-row: 2; }
  .train-assembly[data-cars="3"] .loco-wrap { grid-row: 3; }
  .car-body { gap: 3px; }
}
@media (max-width: 420px) {
  .car { padding: 6px 5px 14px; }
  .seat { width: 76px; height: 76px; }
}
@media (max-width: 380px) {
  .loco-wrap { width: 78px; height: 66px; }
}

/* Phone: keep the count card and go flag always reachable (designer fix, Oct 28) */
@media (max-width: 680px) {
  #hud {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 20;
    justify-content: center;
    background: rgba(255, 244, 224, 0.94);
    border: 3px solid var(--ink);
    border-radius: 28px;
    padding: 8px 14px;
    width: auto;
    margin: 0;
    box-shadow: 0 4px 0 var(--ink);
  }
  [data-screen="play"] { padding-bottom: 130px; }
  #count-card { padding: 2px 14px 6px; min-width: 92px; border-width: 2px; }
  #count-num { font-size: 56px; }
  #btn-go { width: 72px; height: 72px; min-width: 72px; min-height: 72px; }
}

/* Sound toggle lives on home only; on play the speaker means "say again" (designer fix) */
body:has([data-screen="play"]:not([hidden])) #btn-sound { display: none; }</style>
</head>
<body>
<div id="app">
  <button type="button" id="btn-sound" aria-pressed="true" aria-label="声音开着"></button>
  <section data-screen="home">
    <h1 id="title">小火车数数</h1>
    <div id="home-train"></div>
    <button type="button" id="btn-play">开始</button>
    <button type="button" id="btn-stickers" aria-label="贴纸册">贴纸册</button>
    <div id="level-grid"></div>
  </section>
  <section data-screen="play" hidden>
    <header class="play-bar">
      <button type="button" id="btn-home" aria-label="回首页"></button>
      <p id="prompt-text"></p>
      <button type="button" id="btn-say" aria-label="再说一遍"></button>
    </header>
    <div id="rail"></div>
    <div id="platform"></div>
    <div id="hud">
      <div id="count-card" aria-live="polite">
        <div id="count-num">0</div>
        <div id="count-dots"></div>
      </div>
      <button type="button" id="btn-go" aria-label="发车"></button>
    </div>
    <div id="reward" hidden>
      <div id="reward-card">
        <p id="reward-cheer">真棒！</p>
        <div id="reward-sticker"></div>
        <div id="confetti"></div>
        <button type="button" id="btn-next">下一关</button>
        <button type="button" id="btn-reward-home" aria-label="回首页">回首页</button>
      </div>
    </div>
  </section>
  <section data-screen="stickers" hidden>
    <header class="book-bar">
      <button type="button" id="btn-book-home" aria-label="回首页"></button>
      <h2>贴纸册</h2>
    </header>
    <p id="sticker-empty" hidden>开火车就能拿到贴纸</p>
    <div id="sticker-book"></div>
  </section>
</div>
<script>
(function () {
"use strict";
// --- levels.js ---
const LEVELS = [
  { target: 'bear', count: 1, crowd: { bear: 3 } },
  { target: 'bear', count: 2, crowd: { bear: 4 } },
  { target: 'rabbit', count: 3, crowd: { rabbit: 5 } },
  { target: 'rabbit', count: 4, crowd: { rabbit: 6 } },
  { target: 'cat', count: 5, crowd: { cat: 7 } },
  { target: 'bear', count: 3, crowd: { bear: 3, rabbit: 3 } },
  { target: 'rabbit', count: 4, crowd: { bear: 3, rabbit: 5 } },
  { target: 'cat', count: 5, crowd: { cat: 6, bear: 3 } },
  { target: 'bear', count: 6, crowd: { bear: 7, cat: 2 } },
  { target: 'rabbit', count: 7, crowd: { rabbit: 8, bear: 2 } },
];

// --- state.js ---
const STORAGE_KEY = 'daisyTrain.v1';

const KINDS = ['bear', 'rabbit', 'cat'];

function freshProgress() {
  return { unlocked: 1, stickers: [], sound: true };
}

function normalize(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
  const { unlocked, stickers, sound } = data;
  if (!Number.isInteger(unlocked) || unlocked < 1 || unlocked > 10) return null;
  if (typeof sound !== 'boolean') return null;
  if (!Array.isArray(stickers)) return null;
  const clean = [];
  for (const n of stickers) {
    if (!Number.isInteger(n) || n < 1 || n > 10) return null;
    if (!clean.includes(n)) clean.push(n);
  }
  return { unlocked, stickers: clean, sound };
}
function seatCountFor(level) {
  const spec = LEVELS[level - 1];
  if (!spec) return 0;
  return Math.min(9, spec.count + 2);
}
function createGame(storage) {
  function readRaw() {
    try {
      return storage.getItem(STORAGE_KEY);
    } catch {
      return null;
    }
  }

  function write(progress) {
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch {
      /* storage may be blocked; keep memory copy */
    }
  }

  let progress;
  const raw = readRaw();
  if (raw == null || raw === '') {
    progress = freshProgress();
  } else {
    let parsed = null;
    try {
      parsed = JSON.parse(raw);
    } catch {
      parsed = null;
    }
    const ok = normalize(parsed);
    if (!ok) {
      progress = freshProgress();
      write(progress);
    } else {
      progress = ok;
    }
  }

  let level = null;
  /** @type {{id:string,kind:string,seat:number|null,order:number}[]} */
  let actors = [];
  let order = 0;

  function spec() {
    return level ? LEVELS[level - 1] : null;
  }

  function startLevel(n) {
    const num = Number(n);
    if (!Number.isInteger(num) || num < 1 || num > LEVELS.length) return false;
    level = num;
    actors = [];
    order = 0;
    const crowd = LEVELS[num - 1].crowd;
    let i = 1;
    for (const kind of KINDS) {
      const c = crowd[kind] || 0;
      for (let k = 0; k < c; k += 1) {
        actors.push({ id: 'a' + i, kind, seat: null, order: 0 });
        i += 1;
      }
    }
    return true;
  }

  function find(id) {
    return actors.find((a) => a.id === id) || null;
  }

  function board(id) {
    const s = spec();
    if (!s) return { ok: false, reason: 'idle' };
    const actor = find(id);
    if (!actor) return { ok: false, reason: 'missing' };
    if (actor.seat != null) return { ok: false, reason: 'aboard' };
    if (actor.kind !== s.target) return { ok: false, reason: 'kind' };
    const total = seatCountFor(level);
    const used = new Set(actors.filter((a) => a.seat != null).map((a) => a.seat));
    let seat = -1;
    for (let i = 0; i < total; i += 1) {
      if (!used.has(i)) {
        seat = i;
        break;
      }
    }
    if (seat < 0) return { ok: false, reason: 'full' };
    order += 1;
    actor.seat = seat;
    actor.order = order;
    return { ok: true, seat };
  }

  function unboard(id) {
    const actor = find(id);
    if (!actor || actor.seat == null) return { ok: false, reason: 'platform' };
    actor.seat = null;
    actor.order = 0;
    return { ok: true };
  }

  function targetCount() {
    const s = spec();
    if (!s) return 0;
    return actors.filter((a) => a.seat != null && a.kind === s.target).length;
  }

  function isComplete() {
    const s = spec();
    if (!s) return false;
    return targetCount() === s.count;
  }

  function finishLevel() {
    if (!isComplete() || level == null) return false;
    if (!progress.stickers.includes(level)) progress.stickers.push(level);
    progress.stickers.sort((a, b) => a - b);
    const next = Math.min(10, level + 1);
    if (progress.unlocked < next) progress.unlocked = next;
    if (progress.unlocked > 10) progress.unlocked = 10;
    write(progress);
    return true;
  }

  function progressView() {
    return {
      unlocked: progress.unlocked,
      stickers: progress.stickers.slice(),
      sound: progress.sound,
    };
  }

  function setSound(on) {
    progress.sound = Boolean(on);
    write(progress);
    return progress.sound;
  }

  function extras() {
    const s = spec();
    if (!s) return [];
    const aboard = actors
      .filter((a) => a.seat != null && a.kind === s.target)
      .sort((a, b) => b.order - a.order);
    const over = aboard.length - s.count;
    if (over <= 0) return [];
    return aboard.slice(0, over).map((a) => a.id);
  }

  return {
    startLevel,
    board,
    unboard,
    targetCount,
    isComplete,
    finishLevel,
    progress: progressView,
    setSound,
    extras,
    passengers() {
      return actors.map((a) => ({ id: a.id, kind: a.kind, seat: a.seat }));
    },
    boarded() {
      return actors
        .filter((a) => a.seat != null)
        .sort((a, b) => a.seat - b.seat)
        .map((a) => ({ id: a.id, kind: a.kind }));
    },
    target() {
      return spec() ? spec().target : null;
    },
    need() {
      return spec() ? spec().count : 0;
    },
    level() {
      return level;
    },
    seats() {
      return level ? seatCountFor(level) : 0;
    },
  };
}

// --- audio.js ---
let ctx = null;
let soundOn = true;
let unlocked = false;

function context() {
  const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!AC) return null;
  if (!ctx) ctx = new AC();
  return ctx;
}
function setAudioEnabled(on) {
  soundOn = Boolean(on);
}
function unlockAudio() {
  try {
    const c = context();
    if (!c) return;
    unlocked = true;
    if (c.state === 'suspended') {
      c.resume().catch(() => {});
    }
  } catch {
    /* ignore */
  }
}

function envGain(c, start, dur, peak) {
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  return g;
}

function blip(type, freq, dur, peak, delay) {
  try {
    if (!soundOn) return;
    const c = context();
    if (!c) return;
    if (c.state === 'suspended' && unlocked) c.resume().catch(() => {});
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    const g = envGain(c, t, dur, peak);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  } catch {
    /* ignore */
  }
}
function pop() {
  blip('sine', 520, 0.12, 0.18, 0);
  blip('triangle', 780, 0.1, 0.08, 0.02);
}
function boop() {
  blip('sine', 280, 0.16, 0.16, 0);
  blip('sine', 180, 0.14, 0.08, 0.04);
}
function hmm() {
  blip('sine', 196, 0.16, 0.14, 0);
  blip('sine', 146, 0.2, 0.12, 0.16);
}

/** Two square voices through a lowpass, about 0.6s. */
function whistle() {
  try {
    if (!soundOn) return;
    const c = context();
    if (!c) return;
    if (c.state === 'suspended' && unlocked) c.resume().catch(() => {});
    const t = c.currentTime;
    const dur = 0.6;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, t);
    filter.Q.value = 0.7;
    const master = envGain(c, t, dur, 0.2);
    filter.connect(master);
    master.connect(c.destination);
    [523, 659].forEach((freq) => {
      const o = c.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.linearRampToValueAtTime(freq * 1.04, t + dur);
      o.connect(filter);
      o.start(t);
      o.stop(t + dur + 0.02);
    });
  } catch {
    /* ignore */
  }
}
function say(text) {
  try {
    if (!soundOn) return;
    const synth = globalThis.speechSynthesis;
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== 'function') return;
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.pitch = 1.1;
    synth.cancel();
    synth.speak(u);
  } catch {
    /* browsers without speech stay quiet */
  }
}

function train(seats) {
  const total = Math.max(1, Math.min(9, Number(seats) || 3));
  const carSizes = [];
  if (total <= 6) {
    const first = Math.ceil(total / 2);
    carSizes.push(first);
    if (total - first > 0) carSizes.push(total - first);
  } else {
    const first = Math.ceil(total / 3);
    const rem = total - first;
    const second = Math.ceil(rem / 2);
    carSizes.push(first, second, rem - second);
  }
  let idx = 0;
  const carsHtml = carSizes
    .map((n, carIdx) => {
      const seatSlots = [];
      for (let i = 0; i < n; i += 1) {

        </div>

}

      const earned = prog.stickers.includes(n);
      if (earned) {
        return `<div class="sticker earned" data-sticker="${n}" aria-label="第 ${n} 关贴纸，已获得">
          ${sticker(n, lv.target)}
        </div>`;
      }
      return `<div class="sticker" data-sticker="${n}" aria-label="第 ${n} 关贴纸，未获得">
        <span class="sticker-slot-num">${n}</span>
      </div>`;
    }).join('');
    showScreen('stickers');
  }

  function promptSentence() {
    const t = game.target();
    const need = game.need();
    const name = KIND_NAME[t] || '';
    return `送 ${need} 只${name}上车`;
  }

  function voicePromptSentence() {
    const t = game.target();
    const need = game.need();
    const name = KIND_NAME[t] || '';
    return `请把 ${need} 只${name}送上火车`;
  }

  function createPassengerButton(actor, boarded) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'passenger';
    btn.dataset.id = actor.id;
    btn.dataset.kind = actor.kind;
    btn.dataset.boarded = boarded ? '1' : '0';
    const name = KIND_NAME[actor.kind] || actor.kind;
    btn.setAttribute(
      'aria-label',
      boarded ? `车上的${name}，点击跳回站台` : `站台上的${name}，点击上车`,
    );
    btn.innerHTML = animal(actor.kind);
    return btn;
  }

  function updateHUD() {
    const count = game.targetCount();
    const need = game.need();
    countNum.textContent = String(count);
    const dots = [];
    for (let i = 0; i < count; i += 1) {
      dots.push(`<span class="dot${i < need ? '' : ' dot-extra'}"></span>`);
    }
    countDots.innerHTML = dots.join('');

    const ready = game.isComplete();
    btnGo.classList.toggle('ready', ready);
    btnGo.dataset.ready = ready ? '1' : '0';
    btnGo.setAttribute('aria-label', ready ? '数量对了，点击发车' : '发车（再数一数）');
  }

  function syncPassengersDOM(animatedId, animClass) {
    const seats = rail.querySelectorAll('.seat');
    seats.forEach((s) => {
      s.innerHTML = '';
    });
    platform.innerHTML = '';

    const list = game.passengers();
    list.forEach((actor) => {
      const boarded = actor.seat != null;
      const btn = createPassengerButton(actor, boarded);
      if (animatedId === actor.id && animClass && !prefersReducedMotion()) {
        btn.classList.add(animClass);
      }
      if (boarded) {
        const seatEl = rail.querySelector(`.seat[data-seat="${actor.seat}"]`);
        if (seatEl) seatEl.appendChild(btn);
      } else {
        platform.appendChild(btn);
      }
    });
    updateHUD();
  }

  function bounceBackExtras() {
    const extraIds = game.extras();
    if (extraIds.length === 0) return;
    extraIds.forEach((id) => {
      game.unboard(id);
    });
    boop();
    syncPassengersDOM(extraIds[0], 'hop-down');
  }

  function openLevel(n) {
    if (!game.startLevel(n)) return false;
    clearTimers();
    departing = false;
    reward.setAttribute('hidden', '');

    promptText.textContent = promptSentence();
    const reduce = prefersReducedMotion();
    rail.innerHTML = `<div class="train-stage${reduce ? '' : ' entering'}">
      ${train(game.seats())}
    </div>
    <div class="rail-track" aria-hidden="true"></div>`;

    syncPassengersDOM(null, null);
    showScreen('play');
    say(voicePromptSentence());
    return true;
  }

  function spawnSteam() {
    const box = rail.querySelector('.steam-box');
    if (!box) return;
    box.innerHTML = '';
    for (let i = 0; i < 8; i += 1) {
      const puff = document.createElement('span');
      puff.className = 'steam-puff';
      puff.style.setProperty('--i', String(i));
      box.appendChild(puff);
    }
  }

  function spawnConfetti() {
    const colors = ['#e63946', '#ffcf3f', '#6abf4b', '#7ec8e3', '#f4a259', '#ffb7c5'];
    const pieces = [];
    for (let i = 0; i < 16; i += 1) {
      const c = colors[i % colors.length];
      const left = (i * 6 + 5) % 95;
      const delay = (i % 5) * 0.06;
      pieces.push(
        `<span class="confetti-piece" style="left:${left}%;background:${c};animation-delay:${delay}s"></span>`,
      );
    }
    confetti.innerHTML = pieces.join('');
  }

  function showRewardModal(lvl, kind) {
    rewardSticker.innerHTML = sticker(lvl, kind);
    spawnConfetti();
    if (lvl >= 10) {
      btnNext.textContent = '去贴纸册';
      btnNext.setAttribute('aria-label', '去贴纸册');
    } else {
      btnNext.textContent = '下一关';
      btnNext.setAttribute('aria-label', '下一关');
    }
    reward.removeAttribute('hidden');
    say('真棒！');
  }

  function handlePassengerClick(btn) {
    if (departing) return;
    const id = btn.dataset.id;
    const boarded = btn.dataset.boarded === '1';
    if (boarded) {
      const res = game.unboard(id);
      if (res.ok) {
        boop();
        syncPassengersDOM(id, 'hop-down');
        if (game.isComplete()) {
          say(`对啦，${game.need()} 只！`);
        }
      }
      return;
    }

    const res = game.board(id);
    if (!res.ok) {
      if (res.reason === 'kind') {
        hmm();
        if (!prefersReducedMotion()) {
          btn.classList.remove('shake');
          void btn.offsetWidth;
          btn.classList.add('shake');
        }
        say(voicePromptSentence());
      }
      return;
    }

    pop();
    syncPassengersDOM(id, 'hop-up');

    if (game.isComplete()) {
      say(`对啦，${game.need()} 只！`);
    }
  }

  function handleGoClick() {
    if (departing) return;
    const count = game.targetCount();
    const need = game.need();
    if (!game.isComplete()) {
      if (count > need) {
        bounceBackExtras();
      } else {
        boop();
      }
      say(`再数一数，车上有 ${ game.targetCount() } 只`);
      return;
    }

    const lvl = game.level();
    const kind = game.target();
    game.finishLevel();
    departing = true;
    whistle();
    const stage = rail.querySelector('.train-stage');
    if (stage && !prefersReducedMotion()) {
      stage.classList.remove('entering');
      stage.classList.add('departing');
      spawnSteam();
      rewardTimer = setTimeout(() => {
        if (departing && currentScreen === 'play') {
          showRewardModal(lvl, kind);
        }
      }, 650);
    } else {
      showRewardModal(lvl, kind);
    }
  }

  // Unlock Web Audio on first user gesture
  const unlockOnce = () => {
    unlockAudio();
  };
  document.addEventListener('pointerdown', unlockOnce, { passive: true });
  document.addEventListener('keydown', unlockOnce, { passive: true });

  btnSound.addEventListener('click', () => {
    const next = !game.progress().sound;
    game.setSound(next);
    syncSoundButton();
  });

  btnPlay.addEventListener('click', () => {
    const unlocked = game.progress().unlocked;
    openLevel(unlocked);
  });

  btnStickers.addEventListener('click', () => {
    renderStickers();
  });

  levelGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('button.level');
    if (!btn || btn.disabled) return;
    const n = Number(btn.dataset.level);
    openLevel(n);
  });

  btnHome.addEventListener('click', () => {
    renderHome();
  });

  btnSay.addEventListener('click', () => {
    say(voicePromptSentence());
  });

  rail.addEventListener('click', (e) => {
    const btn = e.target.closest('button.passenger');
    if (!btn) return;
    handlePassengerClick(btn);
  });

  platform.addEventListener('click', (e) => {
    const btn = e.target.closest('button.passenger');
    if (!btn) return;
    handlePassengerClick(btn);
  });

  btnGo.addEventListener('click', () => {
    handleGoClick();
  });

  btnNext.addEventListener('click', () => {
    const lvl = game.level() || 1;
    if (lvl >= 10) {
      renderStickers();
    } else {
      openLevel(lvl + 1);
    }
  });

  btnRewardHome.addEventListener('click', () => {
    renderHome();
  });

  btnBookHome.addEventListener('click', () => {
    renderHome();
  });

  syncSoundButton();
  renderHome();

  return {
    openLevel,
    renderHome,
    renderStickers,
    screen() {
      return currentScreen;
    },
  };
}

// --- main.js ---
const storage = (() => {
  try {
    return globalThis.localStorage;
  } catch {
    return {
      getItem() {
        return null;
      },
      setItem() {},
    };
  }
})();

const game = createGame(storage);
const ui = initUI(game);

globalThis.__game = {
  progress() {
    return game.progress();
  },
  startLevel(n) {
    return ui.openLevel(n);
  },
  state() {
    return {
      screen: ui.screen(),
      level: game.level(),
      boarded: game.boarded(),
      target: game.target(),
      need: game.need(),
    };
  },
};
})();
</script>
</body>
</html>
